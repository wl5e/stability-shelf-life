name: replenish-backlog

on:
  schedule:
    # Monday 11:40 UTC — DeepSeek off-peak (see daily.yml for the window).
    - cron: "40 11 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Propose items even if the backlog is not low"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: replenish-backlog
  cancel-in-progress: false

jobs:
  replenish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate current backlog
        run: python scripts/backlog.py --check

      - name: Propose backlog items if low
        run: python scripts/replenish.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        env:
          GIT_AUTHOR_NAME: Collins Amatu Gorgerat
          GIT_AUTHOR_EMAIL: 133529715+wl5e@users.noreply.github.com
          GIT_COMMITTER_NAME: Collins Amatu Gorgerat
          GIT_COMMITTER_EMAIL: 133529715+wl5e@users.noreply.github.com
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Automation failure: ${{ github.workflow }}"
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
