name: daily-contribution

on:
  schedule:
    # 11:23 UTC — DeepSeek off-peak. Weekday peak is 01:00–04:00 and
    # 06:00–10:00 UTC; 11:23 sits comfortably in the cheap window (and
    # weekends are off-peak all day).
    - cron: "23 11 * * *"
  workflow_dispatch: # manual trigger for testing

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Daily increment (applies, tests, commits only if green)
        run: python scripts/daily.py
        env:
          # Authoring: the noreply email makes these commits count on the
          # contribution graph under the wl5e account.
          GIT_AUTHOR_NAME: Collins Amatu Gorgerat
          GIT_AUTHOR_EMAIL: 133529715+wl5e@users.noreply.github.com
          GIT_COMMITTER_NAME: Collins Amatu Gorgerat
          GIT_COMMITTER_EMAIL: 133529715+wl5e@users.noreply.github.com
          # DeepSeek provider (optional — used only for items without a handler).
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
