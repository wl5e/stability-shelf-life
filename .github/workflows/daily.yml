name: daily-contribution

on:
  schedule:
    # 11:23 UTC — DeepSeek off-peak. Weekdays only: the repo rests on weekends.
    - cron: "23 11 * * 1-5"
  workflow_dispatch: # manual trigger for testing

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-contribution
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight — the test gate must be executable
        run: python -m pytest --version

      - name: Preflight — provider key present
        run: test -n "$DEEPSEEK_API_KEY"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Validate backlog
        run: python scripts/backlog.py --check

      - name: Daily increment (applies, tests, commits only if green)
        run: python scripts/daily.py
        env:
          # Authoring: the noreply email makes these commits count on the
          # contribution graph under the wl5e account.
          GIT_AUTHOR_NAME: Collins Amatu Gorgerat
          GIT_AUTHOR_EMAIL: 133529715+wl5e@users.noreply.github.com
          GIT_COMMITTER_NAME: Collins Amatu Gorgerat
          GIT_COMMITTER_EMAIL: 133529715+wl5e@users.noreply.github.com
          # DeepSeek provider (optional — used only for items without a handler).
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Automation failure: ${{ github.workflow }}"
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
