[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stability-shelf-life"
description = "Pharmaceutical stability shelf-life modelling (ICH Q1E + Arrhenius)."
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = []
classifiers = [
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
stability-shelf-life = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["stability_shelf_life*"]

[tool.setuptools.dynamic]
version = {attr = "stability_shelf_life.__version__"}
